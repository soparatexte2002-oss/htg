    <style>
        /* ============ NORMALIZACIÓN Y TOKENS DE DISEÑO ============ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Paleta cálida — antes azulada, ahora rojiza */
            --fondo-inicio: #1a0b0b;
            --fondo-centro: #3b1a1a;
            --fondo-fin: #1a0b0b;

            --color-principal: #f04c4c;
            --color-principal-hover: #ff6b6b;

            --texto: #faf0f0;
            --texto-apagado: rgba(255, 255, 255, 0.3);

            --sombra-boton: 0 12px 30px rgba(240, 76, 76, 0.25);

            --radio-tarjeta: 20px;
            --radio-boton: 50px;
            --transicion-suave: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 30%, var(--fondo-centro) 0%, var(--fondo-inicio) 70%);
            background-attachment: fixed;
            color: var(--texto);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ ESTRUCTURA GENERAL ============ */
        .escena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 3rem 1.5rem;
        }

        .contenedor {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            animation: entradaSuave 0.8s ease-out both;
        }

        @keyframes entradaSuave {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============ MARCO DEL REPRODUCTOR ============ */
        .marco-video {
            width: 100%;
            border-radius: var(--radio-tarjeta);
            overflow: hidden;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            background: #000;
            transition: transform var(--transicion-suave), box-shadow var(--transicion-suave);
        }

        .marco-video:hover {
            transform: scale(1.01);
            box-shadow: 0 30px 60px -5px rgba(240, 76, 76, 0.2), 0 0 0 1px rgba(240, 76, 76, 0.2);
        }

        vturb-smartplayer {
            display: block;
            width: 100%;
            aspect-ratio: 16/9;
        }

        /* ============ TITULAR PRINCIPAL ============ */
        .titular {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
            color: var(--texto);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .titular .resalte {
            color: var(--color-principal);
            position: relative;
            white-space: nowrap;
        }

        .titular .resalte::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--color-principal);
            opacity: 0.3;
            border-radius: 2px;
        }

        /* ============ BOTÓN DE ACCIÓN (CTA) ============ */
        .boton-accion {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, #ff3a3a 0%, #f04c4c 100%);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1.1rem 2.8rem;
            border: none;
            border-radius: var(--radio-boton);
            cursor: pointer;
            text-decoration: none;
            box-shadow: var(--sombra-boton);
            transition: all var(--transicion-suave);
            position: relative;
            overflow: hidden;
        }

        .boton-accion::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #f04c4c 0%, #ff3a3a 100%);
            opacity: 0;
            transition: opacity var(--transicion-suave);
        }

        .boton-accion:hover::before {
            opacity: 1;
        }

        .boton-accion:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(240, 76, 76, 0.4);
        }

        .boton-accion:active {
            transform: translateY(-1px);
        }

        .boton-accion span,
        .boton-accion svg {
            position: relative;
            z-index: 2;
        }

        .boton-accion svg {
            width: 1.3em;
            height: 1.3em;
            transition: transform var(--transicion-suave);
        }

        .boton-accion:hover svg {
            transform: translateX(5px);
        }

        /* ============ PIE DE PÁGINA ============ */
        .pie {
            margin-top: auto;
            padding: 2.5rem 1rem 1.5rem;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .enlaces-pie {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }

        .enlaces-pie a {
            color: var(--texto-apagado);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color var(--transicion-suave);
            position: relative;
        }

        .enlaces-pie a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--color-principal);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform var(--transicion-suave);
        }

        .enlaces-pie a:hover {
            color: #fff;
        }

        .enlaces-pie a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* ============ DISEÑO ADAPTABLE ============ */
        @media (max-width: 600px) {
            .escena {
                padding: 2rem 1rem;
            }

            .contenedor {
                gap: 2rem;
            }

            .marco-video {
                border-radius: 14px;
            }

            .boton-accion {
                width: 100%;
                max-width: 320px;
                justify-content: center;
                padding: 1rem 2rem;
                font-size: 1rem;
            }

            .enlaces-pie {
                gap: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <main class="escena">
        <div class="contenedor">
            <!-- Reproductor VTurb (nuevo ID: 6ab995f6d7f189eb6f44a0ed) -->
            <div class="marco-video">
                <vturb-smartplayer id="vid-6ab995f6d7f189eb6f44a0ed" style="display: block; margin: 0 auto; width: 100%; "><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 56.25% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>
                <script type="text/javascript">
                    var s=document.createElement("script");
                    s.src="https://scripts.converteai.net/9c027e04-c6fe-4ef1-bc9d-4fd46afe401d/players/6ab995f6d7f189eb6f44a0ed/v4/player.js", s.async=!0,document.head.appendChild(s);

            <p class="titular">
                Haz clic en el botón de abajo para ver la presentación <span class="resalte">¡GRATIS!</span>

            <a href="/aulaesp.html" class="boton-accion" id="ctaButton">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

        <footer class="pie">
            <nav class="enlaces-pie" aria-label="Enlaces legales">
                <a href="politica-privacidad.html">Privacidad</a>
                <a href="termos-uso.html">Términos</a>
                <a href="aviso-legal.html">Aviso Legal</a>
                <a href="politica-reembolso.html">Reembolso</a>
            </nav>
        </footer>
    </main>

    <!-- Propagación de parámetros de la URL a los enlaces -->
    <script>
        (function() {
            const parametros = window.location.search;
            if (!parametros) return;

            // Añade los parámetros al botón CTA
            const botonCta = document.getElementById('ctaButton');
            if (botonCta) {
                const base = botonCta.getAttribute('href');
                botonCta.setAttribute('href', base + parametros);
            }

            // Añade los parámetros a todos los enlaces del pie
            const enlaces = document.querySelectorAll('.enlaces-pie a');
            enlaces.forEach(enlace => {
                const href = enlace.getAttribute('href');
                if (href && !href.startsWith('http')) {
                    enlace.setAttribute('href', href + parametros);
                }
            });
        })();
    </script>
</body>
</html>
