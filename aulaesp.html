  <script>
    function actualizarFecha() {
      const hoy = new Date();
      const dia = String(hoy.getDate()).padStart(2, '0');
      const mes = String(hoy.getMonth() + 1).padStart(2, '0');
      const ano = hoy.getFullYear();
      document.getElementById('data-limite').innerText = dia + '/' + mes + '/' + ano;
    }
    function randomizarPersonas() {
      const min = 727;
      const max = 1000;
      const numero = Math.floor(Math.random() * (max - min + 1)) + min;
      document.getElementById('contador-pessoas').innerText = numero;
    }
    window.addEventListener('load', function() {
      actualizarFecha();
      randomizarPersonas();
    });
  </script>

  <script id="alfa-video-navigation">
  (function(){
    'use strict';
    const button=document.getElementById('cta-button');
    if(!button)return;
    const configuredHref=button.getAttribute('href');
    const keys=[
      'utm_source','utm_medium','utm_campaign','utm_content','utm_term',
      'campaign_id','adset_id','ad_id','placement','site_source_name',
      'gclid','gbraid','wbraid'
    ];
    const entry=new URLSearchParams(location.search);
    function valid(value,max){
      return typeof value==='string'&&value.length>0&&value.length<=max
        &&!/[\u0000-\u001f\u007f@]/.test(value)
        &&!/(?:https?:|sk_live|sk_test|secret_)/i.test(value);
    }
    function updateLink(){
      try{
        const target=new URL(configuredHref,location.href);
        for(const key of keys){
          const value=entry.get(key);
          if(valid(value,200))target.searchParams.set(key,value);
        }
        button.href=target.href;
      }catch{}
    }
    updateLink();
    for(const event of ['click','auxclick','contextmenu','focus'])button.addEventListener(event,updateLink);
    window.addEventListener('pageshow',updateLink);
  })();
  </script>
